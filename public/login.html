<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agentforce Voice Demo — Sign in</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .login-wrap { min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(120% 90% at 50% 0%, #10406b, #062a4d 55%, #041d3d); }
    .login-card { background: #fff; padding: 34px; border-radius: 16px; width: 340px;
      box-shadow: 0 30px 60px rgba(3,45,96,0.35); text-align: center; }
    .login-card img { width: 64px; height: 64px; object-fit: contain; }
    .login-card h1 { font-size: 19px; margin: 12px 0 4px; color: #16325c; }
    .login-card p { font-size: 13px; color: #5a6b85; margin: 0 0 20px; }
    .login-card input { width: 100%; padding: 11px; border: 1px solid #e2e8f2;
      border-radius: 8px; font: inherit; margin-bottom: 12px; }
    .login-card button { width: 100%; padding: 12px; border: none; border-radius: 999px;
      background: #0d9dda; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
    .err { color: #ea001e; font-size: 13px; min-height: 18px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="form">
      <img src="/assets/astro.png" alt="Astro" />
      <h1>Agentforce Voice Demo</h1>
      <p>Enter the team passcode to continue.</p>
      <input id="passcode" type="password" placeholder="Passcode" autofocus autocomplete="current-password" />
      <button type="submit">Enter</button>
      <div class="err" id="err"></div>
    </form>
  </div>
  <script>
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const passcode = document.getElementById("passcode").value;
      const err = document.getElementById("err");
      err.textContent = "";
      const r = await fetch("/login", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ passcode }),
      });
      if (r.ok) location.href = "/";
      else err.textContent = "Incorrect passcode. Try again.";
    });
  </script>
</body>
</html>
