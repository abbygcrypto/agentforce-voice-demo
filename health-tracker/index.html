<title>Baseline Health Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
<style>
/* Layout: one phone-first column (max 720px), sticky date bar + three tabs; each log area is a quiet card of tap-chips. */
:root {
  --bg: #f2f6f4; --surface: #ffffff; --surface-2: #e8efec; --ink: #13201d; --muted: #586964; --line: #d6e0dc;
  --accent: #0b7564; --accent-ink: #ffffff; --accent-soft: #d3eee7; --danger: #b93a26; --period: #c0407a;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --seq0: #e3eae7; --seq1: #b7d3f6; --seq2: #6da7ec; --seq3: #2a78d6; --seq4: #184f95;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1412; --surface: #151f1c; --surface-2: #1d2a26; --ink: #e6eeeb; --muted: #9aaca6; --line: #2a3a35;
  --accent: #3fc3a9; --accent-ink: #052019; --accent-soft: #15382f; --danger: #f07a63; --period: #e472a6;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --seq0: #22302c; --seq1: #184f95; --seq2: #256abf; --seq3: #3987e5; --seq4: #86b6ef; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1412; --surface: #151f1c; --surface-2: #1d2a26; --ink: #e6eeeb; --muted: #9aaca6; --line: #2a3a35;
  --accent: #3fc3a9; --accent-ink: #052019; --accent-soft: #15382f; --danger: #f07a63; --period: #e472a6;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --seq0: #22302c; --seq1: #184f95; --seq2: #256abf; --seq3: #3987e5; --seq4: #86b6ef; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); margin: 0; }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 0 64px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 1.35rem; font-weight: 800; }
.brand h1 span { color: var(--accent); }
.status { font-size: .8rem; color: var(--muted); }
.status.err { color: var(--danger); }
.tabs { display: flex; gap: 4px; margin-top: 10px; background: var(--surface-2); padding: 4px; border-radius: 12px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 8px; border-radius: 9px; font-weight: 700; cursor: pointer; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }

/* Date bar + progress */
.datebar { display: flex; align-items: center; gap: 8px; margin-block: 18px 6px; }
.datebar h2 { font-size: 1.6rem; font-weight: 700; flex: 1; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 1.1rem; display: grid; place-items: center; }
.iconbtn:disabled { opacity: .35; cursor: default; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 700; cursor: pointer; padding: 6px 4px; }
.progress { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.pill { font-size: .8rem; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
.pill.done { background: var(--accent-soft); border-color: transparent; color: var(--ink); }
.pill.done::before { content: "✓ "; color: var(--accent); font-weight: 700; }
.progress .count { font-size: .8rem; color: var(--muted); align-self: center; margin-left: auto; }

.banner { border: 1px dashed var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: .92rem; }
.banner p { margin: 0; flex: 1 1 260px; }
.tag { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }

/* Log cards */
.stack { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-head h3 { font-size: 1.15rem; font-weight: 700; }
.hint { font-size: .82rem; color: var(--muted); margin: 0; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 12px; }
.row > .field { flex: 1 1 120px; }
input[type="number"], input[type="text"], input[type="time"], select, textarea { width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; }
textarea { resize: vertical; min-height: 64px; }
textarea.journal { min-height: 160px; line-height: 1.55; font-size: 1rem; }
.entries { display: grid; gap: 12px; }
.entry { display: grid; gap: 4px; padding-block: 12px; border-top: 1px solid var(--line); }
.entry:first-child { border-top: 0; padding-top: 0; }
.entry .when { font-size: .8rem; color: var(--muted); }
.entry p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.hm { display: flex; align-items: center; gap: 6px; }
.hm input { width: 72px; }
.hm span { color: var(--muted); font-size: .9rem; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-width: 44px; min-height: 40px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.period[aria-pressed="true"] { background: var(--period); border-color: var(--period); color: #fff; }
.scale { display: grid; gap: 4px; }
.scale .ends { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); max-width: 290px; }
.scale .chips .chip { flex: 0 0 auto; }

/* Totals + list rows */
.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.total { background: var(--bg); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; }
.total b { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; }
.total small { color: var(--muted); font-size: .78rem; }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.water { display: flex; align-items: center; gap: 10px; }
.water b { font-family: var(--font-display); font-size: 1.3rem; min-width: 3ch; text-align: center; }
.items { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: minmax(0, 2.2fr) repeat(3, minmax(52px, 1fr)) 36px; gap: 6px; align-items: end; }
.item.lift { grid-template-columns: minmax(0, 2.2fr) repeat(3, minmax(52px, 1fr)) 36px; }
.item .field > label { font-size: .68rem; }
.item input { padding: 8px; }
.del { height: 40px; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1.2rem; border-radius: 8px; }
.del:hover { color: var(--danger); background: var(--surface-2); }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 700; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.quiet { font-weight: 400; font-size: .88rem; padding: 6px 10px; }
.btn.warn { color: var(--danger); }
@media (max-width: 480px) {
  .item, .item.lift { grid-template-columns: repeat(3, minmax(0, 1fr)) 36px; }
  .item > .field:first-child { grid-column: 1 / -1; }
}

/* Trends */
.range { display: flex; gap: 6px; margin-block: 18px; align-items: center; flex-wrap: wrap; }
.range .lbl { margin-right: 6px; }
.insights { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 14px; }
.insight { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; align-content: start; }
.insight .k { font-size: .75rem; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--muted); }
.insight .v { font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; line-height: 1.1; }
.insight p { margin: 0; font-size: .88rem; color: var(--muted); }
.chart { width: 100%; min-width: 0; position: relative; }
.chart svg { display: block; touch-action: pan-y; }
.chart text { fill: var(--muted); font: 11px var(--font-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .xh { stroke: var(--muted); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.legend i.box { height: 12px; width: 12px; border-radius: 3px; }
.empty { padding: 22px 8px; text-align: center; color: var(--muted); font-size: .9rem; }
.hbars { display: grid; gap: 6px; }
.hbar { display: grid; grid-template-columns: 110px 1fr 36px; gap: 8px; align-items: center; font-size: .88rem; }
.hbar .track { height: 12px; }
.hbar .track i { display: block; height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; min-width: 2px; }
.footnote { font-size: .8rem; color: var(--muted); margin-top: 8px; }

/* History */
.days { display: grid; gap: 8px; }
.day { text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; cursor: pointer; display: grid; gap: 4px; }
.day:hover { border-color: var(--accent); }
.day .d { font-weight: 700; display: flex; gap: 8px; align-items: center; }
.day .s { font-size: .85rem; color: var(--muted); }

#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .8rem; padding: 7px 9px; border-radius: 8px; max-width: 240px; line-height: 1.4; }
#tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
@media (prefers-reduced-motion: no-preference) { .chip, .pill, .tabs button { transition: background-color .15s, color .15s; } }

/* Lifts on the Log tab */
.lifts { display: grid; gap: 10px; }
.liftrow { display: grid; gap: 6px; padding: 10px 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
.liftrow .top { display: grid; grid-template-columns: minmax(0, 1fr) 36px; gap: 6px; align-items: center; }
.liftrow .nums { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.liftrow .nums > input { width: 92px; }
.liftrow .nums .wt { width: 110px; }
.liftrow input { padding: 7px 8px; background: var(--surface); }
.liftrow .name { font-weight: 700; }
.liftrow .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: .82rem; color: var(--muted); }
.liftrow .meta .btn { padding: 3px 9px; font-size: .8rem; }
.liftrow .note { font-size: .88rem; }
.delta { font-weight: 700; font-size: .8rem; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.delta.up { background: var(--accent-soft); color: var(--accent); }
.wt { position: relative; }
.wt input { padding-right: 30px; }
.wt span { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: .78rem; color: var(--muted); pointer-events: none; }

/* Program */
.weekline { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.weekline b { font-family: var(--font-display); font-size: 1.15rem; }
.exlist { display: grid; }
.ex { display: grid; grid-template-columns: minmax(0, 1fr) auto 84px; gap: 4px 12px; align-items: center; padding-block: 9px; border-top: 1px solid var(--line); }
.ex:first-child { border-top: 0; }
.ex .n { font-weight: 700; min-width: 0; }
.ex .n small { display: block; font-weight: 400; color: var(--muted); font-size: .8rem; }
.ex .w { text-align: right; font-size: .9rem; white-space: nowrap; }
.ex .w small { display: block; color: var(--muted); font-size: .76rem; }
.ex svg { display: block; }
.exedit { display: grid; grid-template-columns: minmax(0, 1fr) 120px 36px; gap: 6px; align-items: center; }
</style>

<div id="tip" hidden></div>
<header>
  <div class="wrap" style="padding-block:0">
    <div class="brand"><h1>Baseline<span>.</span></h1><span class="status" id="status" aria-live="polite">Connecting…</span></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-today" aria-selected="true" data-tab="today">Log</button>
      <button role="tab" id="tab-program" aria-selected="false" data-tab="program">Program</button>
      <button role="tab" id="tab-trends" aria-selected="false" data-tab="trends">Trends</button>
      <button role="tab" id="tab-history" aria-selected="false" data-tab="history">History</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="today" role="tabpanel">
    <div class="datebar">
      <button class="iconbtn" id="prev" aria-label="Previous day">‹</button>
      <h2 id="dateTitle">Today</h2>
      <button class="linkbtn" id="toToday" hidden>Today</button>
      <button class="iconbtn" id="next" aria-label="Next day">›</button>
    </div>
    <div class="progress" id="progress"></div>
    <div id="banners"></div>
    <div class="stack" id="form"><div class="card"><p class="empty">Loading your log…</p></div></div>
  </section>

  <section id="program" role="tabpanel" hidden><div id="progBody"></div></section>

  <section id="trends" role="tabpanel" hidden>
    <div class="range" id="range">
      <span class="lbl">Show</span>
      <button class="chip" data-range="14">14 days</button>
      <button class="chip" data-range="30">30 days</button>
      <button class="chip" data-range="90">90 days</button>
    </div>
    <div id="trendBody"></div>
  </section>

  <section id="history" role="tabpanel" hidden><div id="histBody"></div></section>
</main>
<script>
(() => {
'use strict';
// ---------- helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
const fmtDay = (s, o = { weekday: 'short', day: 'numeric', month: 'short' }) => parse(s).toLocaleDateString(undefined, o);
const short = s => fmtDay(s, { day: 'numeric', month: 'short' });
const today = () => ymd(new Date());
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const r1 = v => Math.round(v * 10) / 10;
const r2 = v => Math.round(v * 100) / 100;
const fmtHM = h => { if (h == null) return '–'; const m = Math.round(h * 60); return Math.floor(m / 60) + 'h ' + pad2(m % 60) + 'm'; };
const uid = () => Math.random().toString(36).slice(2, 9);
const key = n => String(n || '').trim().toLowerCase();
const LB = 2.20462;

const SCALES = {
  'sleep.quality': ['Poor', 'Great'], 'feel.mood': ['Low', 'Great'], 'feel.energy': ['Drained', 'Energised'],
  'feel.focus': ['Scattered', 'Locked in'], 'feel.anxiety': ['Calm', 'Very anxious']
};
const WORKOUTS = [['strength', 'Strength'], ['cardio', 'Cardio'], ['hiit', 'HIIT'], ['walk', 'Walk'], ['yoga', 'Yoga / Pilates'], ['rest', 'Rest day']];
const FLOW = [['spotting', 'Spotting'], ['light', 'Light'], ['medium', 'Medium'], ['heavy', 'Heavy']];
const SYMPTOMS = ['Bloating', 'Sugar cravings', 'Very hungry', 'Fatigue', 'Acne', 'Cramps', 'Brain fog', 'Migraine', 'Joint pain', 'Hair shedding', 'Low mood', 'Restless'];
const PLAN = [['on', 'On plan'], ['off', 'Off-plan meal'], ['skipped', 'Skipped a meal']];
const BOWEL = [['normal', 'Normal'], ['loose', 'Loose'], ['constipated', 'Constipated'], ['none', 'None today']];
const WATER = [1, 1.5, 2, 2.5, 3, 3.5, 4];

const S = {
  db: null, dl: null, canWrite: true, loaded: false,
  days: {}, prefs: { unit: 'kg', water: 3, sleep: 8, cycle: 31 },
  program: null,
  cur: today(), draft: null, dirty: false, tab: 'today', range: 30, lift: null,
  armSession: null, editProg: false, armDelDay: null
};

function blank(date) {
  return {
    date,
    sleep: { hours: null, quality: null, bed: '', wake: '' },
    feel: { journal: '', mood: null, energy: null, focus: null, anxiety: null, meds: null, note: '' },
    food: { plan: null, water: null, bowel: null, cravings: null },
    workout: { type: '', session: null, minutes: null, effort: null, steps: null, lifts: [] },
    body: { weight: null, waist: null, hips: null, flow: null, symptoms: [] }
  };
}
function normalize(d, date) {
  const b = blank(date);
  if (!d) return b;
  for (const k of Object.keys(b)) if (b[k] && typeof b[k] === 'object') b[k] = { ...b[k], ...(d[k] || {}) };
  delete b.food.meals;
  if (d.example) b.example = true;
  return clone(b);
}
const getDay = date => S.days[date] ? normalize(S.days[date], date) : null;

// weights are stored in kg; shown in the chosen unit
const toKg = v => v == null || v === '' || isNaN(v) ? null : r2(S.prefs.unit === 'lb' ? v / LB : +v);
const fromKg = v => v == null ? '' : (S.prefs.unit === 'lb' ? r1(v * LB) : r2(v));
const U = () => S.prefs.unit;

const isWorkout = d => d && d.workout.type && d.workout.type !== 'rest';
const done = d => ({
  Sleep: d.sleep.hours != null,
  Feelings: !!(d.feel.journal || '').trim(),
  Nutrition: d.food.plan != null || d.food.water != null || d.food.bowel != null,
  Training: !!d.workout.type,
  Body: d.body.weight != null || !!d.body.flow || d.body.symptoms.length > 0
});

// lift history: every logged weight for an exercise name, oldest first
function history(name, before) {
  const k = key(name), out = [];
  Object.keys(S.days).sort().forEach(dt => {
    if (before && dt >= before) return;
    (S.days[dt].workout?.lifts || []).forEach(l => { if (key(l.name) === k && l.weight != null) out.push({ date: dt, weight: l.weight, scheme: l.scheme, note: l.note }); });
  });
  return out;
}
const lastLift = (name, before) => { const h = history(name, before); return h.length ? h[h.length - 1] : null; };

// cycle: period starts are flow days whose previous day has no flow
function periodStarts(upTo) {
  const flow = dt => dt === S.draft?.date ? !!S.draft.body.flow : !!S.days[dt]?.body?.flow;
  const ks = new Set(Object.keys(S.days).filter(k => S.days[k].body?.flow));
  if (S.draft) { S.draft.body.flow ? ks.add(S.draft.date) : ks.delete(S.draft.date); }
  return [...ks].filter(k => k <= upTo && !flow(addDays(k, -1))).sort();
}
function cycleInfo(dt) {
  const st = periodStarts(dt); if (!st.length) return null;
  const last = st[st.length - 1];
  const gaps = st.slice(1).map((s, i) => diffDays(s, st[i])).filter(g => g >= 20 && g <= 60);
  const len = gaps.length ? Math.round(avg(gaps)) : S.prefs.cycle;
  return { day: diffDays(dt, last) + 1, due: diffDays(addDays(last, len), dt), len, measured: gaps.length > 0 };
}
const dueText = c => c.due > 1 ? `due in about ${c.due} days` : c.due === 1 ? 'due tomorrow' : c.due === 0 ? 'due about today' : `${-c.due} days later than usual`;

// ---------- status + saving ----------
function setStatus(t, err) { const el = $('#status'); el.textContent = t; el.classList.toggle('err', !!err); }
const errText = e => e && e.code === 'quota_exceeded' ? 'Storage is full. Export your data, then remove old days.'
  : e && e.code === 'invalid_argument' ? 'This page is view-only for you, so changes are not saved.'
  : 'Could not save. Check your connection and edit again to retry.';
let saveTimer = null, chain = Promise.resolve();
function touch() {
  if (!S.canWrite) return;
  S.dirty = true; setStatus('Saving…');
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700);
  renderDerived();
}
function flush() {
  clearTimeout(saveTimer); saveTimer = null;
  if (!S.dirty || !S.db) return chain;
  S.dirty = false;
  const date = S.draft.date, body = clone(S.draft);

function spark(h) {
  if (h.length < 2) return '';
  const W = 84, H = 26, vs = h.map(x => x.weight), lo = Math.min(...vs), hi = Math.max(...vs), sp = hi - lo || 1;
  const x = i => 3 + i * (W - 6) / (h.length - 1), y = v => H - 4 - (v - lo) / sp * (H - 8);
  const d = h.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.weight).toFixed(1)).join('');
  const tipTxt = h.map(p => `${short(p.date)}: ${fromKg(p.weight)} ${U()}`).slice(-8).join('<br>');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" data-tip="${esc(tipTxt)}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(h.length - 1)}" cy="${y(vs[vs.length - 1])}" r="3.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/></svg>`;
}

function timeChart(id, dates, series, o) {
  const el = document.getElementById(id); if (!el) return;

  const W = Math.max(260, el.clientWidth), H = o.h || 170;
  const hasEnd = series.length > 1 && series.every(s => s.kind !== 'bar');
  const P = { l: 36, r: hasEnd ? 70 : 14, t: 12, b: o.band ? 34 : 22 };
  const n = dates.length, iw = W - P.l - P.r, ih = H - P.t - P.b;
  const step = n > 1 ? iw / (n - 1) : 0;
  const x = i => P.l + (n === 1 ? iw / 2 : i * step);
  const y = v => P.t + ih - (v - o.min) / (o.max - o.min) * ih;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">`;
  o.ticks.forEach(t => { s += `<line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}"/><text x="${P.l - 6}" y="${y(t) + 4}" text-anchor="end">${o.tickFmt ? o.tickFmt(t) : t}</text>`; });
  [0, Math.floor((n - 1) / 2), n - 1].filter((v, i, a) => a.indexOf(v) === i).forEach(i => {
    s += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${esc(short(dates[i]))}</text>`;
  });
  if (o.band) {
    const bw = Math.max(2, Math.min(10, step || 10) - 1);
    o.band.vals.forEach((v, i) => { if (v) s += `<rect x="${x(i) - bw / 2}" y="${H - 30}" width="${bw}" height="6" rx="2" fill="var(--period)"/>`; });
  }
  if (o.target != null && o.target <= o.max) s += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(o.target)}" y2="${y(o.target)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".55"/><text x="${W - P.r}" y="${y(o.target) - 5}" text-anchor="end">target ${o.tickFmt ? o.tickFmt(o.target) : o.target}</text>`;
  const ends = [];
  series.forEach(se => {
    if (se.kind === 'bar') {
      const bw = Math.max(2, Math.min(16, (iw / n) * 0.62));
      se.vals.forEach((v, i) => {
        if (v == null || v <= o.min) return;
        const x0 = x(i) - bw / 2, x1 = x0 + bw, yt = y(Math.min(v, o.max)), yb = y(o.min), rr = Math.min(4, bw / 2, yb - yt);
        s += `<path d="M${x0} ${yb}V${yt + rr}Q${x0} ${yt} ${x0 + rr} ${yt}H${x1 - rr}Q${x1} ${yt} ${x1} ${yt + rr}V${yb}Z" fill="${se.color}"/>`;
      });
      return;
    }
    const real = se.vals.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean);
    if (!se.dotsOnly && real.length > 1) s += `<path d="${real.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('')}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (se.dotsOnly || n <= 31 || real.length < 20) real.forEach(p => { s += `<circle cx="${p[0]}" cy="${p[1]}" r="${se.dotsOnly ? 3 : 4}" fill="${se.color}" stroke="var(--surface)" stroke-width="${se.dotsOnly ? 1 : 2}"/>`; });
    let li = -1; se.vals.forEach((v, i) => { if (v != null) li = i; });
    if (li >= 0) ends.push({ name: se.name, y: y(se.vals[li]) });
  });
  if (hasEnd) {
    ends.sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13;
    ends.forEach(e => { s += `<text x="${W - P.r + 8}" y="${e.y + 4}" style="fill:var(--ink)">${esc(e.name)}</text>`; });
  }
  s += `<line class="xh" x1="0" x2="0" y1="${P.t}" y2="${P.t + ih}" visibility="hidden"/></svg>`;
  el.innerHTML = s;

}
function chartHover(e) {

  dates.forEach((dt, k) => {

        <div class="field"><label for="pf-cycle">Usual cycle (days)</label><input type="number" id="pf-cycle" data-pref="cycle" value="${p.cycle}"></div>
      </div>
      <p class="hint">Cycle length is only used until you've logged two period starts. After that it uses your real average.</p>
      ${S.dl ? '<div class="btnrow"><button class="btn" id="csv">Export all days as CSV</button></div>' : ''}
    </section>`;
}
let prefTimer, prefChain = Promise.resolve();
function savePrefs() {
  clearTimeout(prefTimer);
  prefTimer = setTimeout(() => { if (!S.db || !S.canWrite) return; const body = clone(S.prefs); prefChain = prefChain.then(() => S.db.doc('settings/prefs').set(body)).then(() => setStatus('Saved'), e => setStatus(errText(e), true)); }, 600);
}
$('#histBody').addEventListener('input', e => { const k = e.target.dataset.pref; if (!k || e.target.value === '') return; S.prefs[k] = +e.target.value; savePrefs(); });
$('#histBody').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.day) { S.cur = t.dataset.day; loadDraft(); renderToday(); showTab('today'); return; }
  if (t.dataset.unit) { S.prefs.unit = t.dataset.unit; savePrefs(); renderHistory(); renderToday(); return; }
  if (t.id === 'csv') exportCsv();
});
async function exportCsv() {
  const cols = ['date', 'weight_' + U(), 'waist_cm', 'hips_cm', 'sleep_hours', 'sleep_quality', 'bedtime', 'woke', 'water_l', 'meal_plan', 'bowel', 'cravings', 'improve_tomorrow', 'how_i_feel', 'energy', 'mood', 'focus', 'anxiety', 'adhd_meds', 'training', 'session', 'minutes', 'rpe', 'steps', 'lifts', 'period', 'symptoms'];
  const q = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = Object.keys(S.days).sort().map(k => {
    const d = getDay(k), sess = d.workout.session && S.program ? (S.program.days.find(x => x.id === d.workout.session) || {}).name : d.workout.session;
    return [k, fromKg(d.body.weight), d.body.waist, d.body.hips, d.sleep.hours, d.sleep.quality, d.sleep.bed, d.sleep.wake, d.food.water, d.food.plan, d.food.bowel, d.food.cravings, d.feel.note, d.feel.journal, d.feel.energy, d.feel.mood, d.feel.focus, d.feel.anxiety, d.feel.meds, d.workout.type, sess, d.workout.minutes, d.workout.effort, d.workout.steps,
      d.workout.lifts.map(l => `${l.name} ${l.scheme || ''} @ ${fromKg(l.weight)}${U()}${l.note ? ' (' + l.note + ')' : ''}`).join('; '), d.body.flow, d.body.symptoms.join('; ')].map(q).join(',');
  });
  try { await S.dl.save({ filename: 'baseline-log-' + today() + '.csv', data: cols.join(',') + '\n' + rows.join('\n') }); }
  catch (e) { if (e && e.code === 'unavailable') { S.dl = null; renderHistory(); } }
}

// ---------- boot ----------
try { const t = localStorage.getItem('baseline.range'); if (t) S.range = +t; } catch (_) {}
loadDraft(); renderToday();
try { const t = localStorage.getItem('baseline.tab'); if (t && t !== 'today' && $('#' + t)) showTab(t); } catch (_) {}

(async () => {
  const use = n => window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [db, user, dl] = await Promise.all([use('db'), use('user'), use('downloads')]);
  S.dl = dl;
  if (!db) { setStatus('Open this page signed in to save your log', true); return; }
  S.db = db;
  if (user && (await user.can('data.write')) === false) S.canWrite = false;
  const formBusy = () => S.dirty || saveTimer || form.contains(document.activeElement);
  db.doc('settings/prefs').onSnapshot(s => {
    if (s.exists) S.prefs = { ...S.prefs, ...s.data() };
    if (!formBusy()) renderToday(); else renderDerived();
    renderTab();
  }, () => {});
  db.doc('program/main').onSnapshot(s => {
    if (progTimer) return; // our own edit is pending
    S.program = s.exists ? clone(s.data()) : null;
    if (!formBusy()) renderToday();
    if (S.tab === 'program' && !$('#progBody').contains(document.activeElement)) renderProgram();
    else if (S.tab !== 'program') renderTab();
  }, () => {});
  db.collection('days').orderBy('date', 'desc').limit(1000).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = clone(d.data()); });
    if ((S.dirty || saveTimer) && S.draft) m[S.draft.date] = clone(S.draft);
    S.days = m;
    const firstLoad = !S.loaded; S.loaded = true;
    if (firstLoad) setStatus(S.canWrite ? 'Ready' : 'View only');
    const fresh = getDay(S.cur) || blank(S.cur);
    if (firstLoad || (!formBusy() && JSON.stringify(fresh) !== JSON.stringify(S.draft))) { S.draft = fresh; renderToday(); }
    renderTab();
  }, e => setStatus(e.code === 'revoked' ? 'Access to this log changed' : 'Lost connection to your log. Reload to retry.', true));
})();
})();
</script>
