# Render.com deployment for the Agentforce Voice Demo.
# Create a new "Blueprint" service from this repo and Render reads this file.
# Set the secret env vars (marked sync:false) in the Render dashboard.
services:
  - type: web
    name: agentforce-voice-demo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ELEVENLABS_API_KEY
        sync: false          # set in dashboard (required)
      - key: APP_PASSCODE
        sync: false          # set in dashboard (recommended — gates access)
      - key: ANTHROPIC_API_KEY
        sync: false          # optional — enables the Claude brain
      - key: PUBLIC_BASE_URL
        sync: false          # optional — set to your Render URL to enable Claude
